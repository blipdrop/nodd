openapi: 3.1.0
info:
  title: Nodd Public API
  version: 0.3.0
  description: |
    An API for sending notifications from services, CLIs, and agents, and receiving responses from people.

    All input goes to the channel of the send key. You do not specify a destination channel in the request body.
    Errors are returned as RFC 9457 `application/problem+json`. The machine-readable value is in `code`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://api.nodd.blipdrop.net
    description: Production
tags:
  - name: Messages
    description: Send notifications and check their state
  - name: Alerts
    description: Resolve alerts
  - name: Actions
    description: Fetch response events
  - name: Inbound
    description: Receive from external services
  - name: Meta
    description: Service status
security:
  - sendKey: []
paths:
  /v1/messages:
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Send a notification
      description: |
        Returns `202` once the message is accepted. Delivery to devices is not guaranteed.
        For kinds that need a response, get the result from `GET /v1/messages/{id}`, a callback, or `GET /v1/actions/events`.
        While a channel is paused, this returns `403 channel_paused`. The channel resumes automatically after the `Retry-After` seconds have passed.
        A channel over the plan limit returns `403 channel_read_only`. Newer channels are stopped first.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
            examples:
              notice:
                summary: Notice
                value:
                  kind: notice
                  level: low
                  title: Backup completed
              approval:
                summary: Approval
                value:
                  kind: approval
                  level: high
                  title: Approve production deploy
                  body: Deploys api v2.4.1 to production
                  fields:
                    - label: Environment
                      value: production
                    - label: Change
                      value: v2.4.0 → v2.4.1
                  links:
                    - label: View changes
                      url: https://github.com/acme/api/pull/482
                  expires_in: 3600
                  on_timeout: reject
      responses:
        "202":
          description: Accepted
          headers:
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAccepted"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`open_actions_exceeded`. The message is rejected rather than delivered without buttons."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get state and response
      description: |
        The server does not hold the request open. Wait the `Retry-After` seconds, then fetch again.
        The message content is not returned, because it is not kept on the server.
      security:
        - replyToken: []
        - sendKey: []
      responses:
        "200":
          description: Current state
          headers:
            Retry-After:
              description: Seconds until the next fetch. Omitted once the response is final.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageState"
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      tags: [Messages]
      operationId: updateMessage
      summary: Update a progress card
      description: |
        Only `kind: progress` messages can be updated. Updates are encrypted and delivered to devices like message content, and are not kept on the server.
        `running` updates are silent; `succeeded` and `failed` send a notification. Any update after that returns `409 invalid_state`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "202":
          description: Accepted
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/messages/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [Messages]
      operationId: getSecret
      summary: Read the sealed answer to a secret request
      description: Returns the sealed value once it has been approved. The server keeps it until you delete it, or for up to 10 minutes.
      responses:
        "200":
          description: Sealed value
          content:
            application/json:
              schema:
                type: object
                required: [sealed]
                properties:
                  sealed:
                    type: string
                    description: base64(enc || ciphertext)
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Messages]
      operationId: deleteSecret
      summary: Delete the sealed answer
      description: Call this after opening the value.
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/messages/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [Messages]
      operationId: cancelMessage
      summary: Cancel a pending response
      description: Cancels an approval or choice before anyone responds. Once a button has been pressed, this returns `409 already_claimed`.
      responses:
        "204":
          description: Cancelled
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/messages/{id}/result:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [Messages]
      operationId: reportResult
      summary: Report the result of handling a response
      description: Send the result of handling a response, and the card changes to `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionResult"
      responses:
        "204":
          description: Recorded
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/alerts/{alert_key}/resolve:
    parameters:
      - name: alert_key
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AlertKey"
    post:
      tags: [Alerts]
      operationId: resolveAlert
      summary: Resolve an alert
      description: Closes open alerts with the same `alert_key` and removes them from everyone's Action tab. Returns `202` even if there is nothing to resolve.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 200
      responses:
        "202":
          description: Accepted
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/heartbeats/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/AlertKey"
    post:
      tags: [Heartbeats]
      operationId: reportHeartbeat
      summary: Report that a scheduled job is alive
      description: |
        If the next report does not arrive within `interval` plus `grace` seconds, the channel is notified.
        If a report arrives after an outage, the channel is told that reports have resumed. Reports do not count as sent messages. Limit of 20 per channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interval]
              properties:
                interval:
                  type: integer
                  minimum: 60
                  maximum: 2678400
                grace:
                  type: integer
                  minimum: 0
                  maximum: 2678400
                  description: Defaults to 10% of `interval`, and is never less than 60 seconds.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [name, due_at]
                properties:
                  name:
                    type: string
                  due_at:
                    type: string
                    format: date-time
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Heartbeats]
      operationId: deleteHeartbeat
      summary: Stop monitoring a heartbeat
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Problem" }
  /v1/actions/events:
    get:
      tags: [Actions]
      operationId: listActionEvents
      summary: Get response events
      description: |
        For services that cannot receive callbacks. Pass `next_cursor` as the next `cursor`.
        To avoid skipping events when writes land out of order, events less than 2 seconds old are held for the next fetch.
      security:
        - readKey: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: List of events
          headers:
            Retry-After:
              description: Seconds until the next fetch
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActionEvent"
                  next_cursor:
                    type: string
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /in/{integration}/{inbound_key}:
    parameters:
      - name: integration
        in: path
        required: true
        schema:
          type: string
          enum: [slack, grafana, alertmanager, generic, datadog, sentry, pagerduty]
      - name: inbound_key
        in: path
        required: true
        description: Inbound key for one channel. Not written to access logs.
        schema:
          type: string
    post:
      tags: [Inbound]
      operationId: receiveInbound
      summary: Receive a notification from an external service
      description: |
        `slack` reads the `text` field of an Incoming Webhook.
        `grafana` and `alertmanager` convert firing to `alert` and recovery to resolve,
        and use the fingerprint as `alert_key` and `dedupe_key`. If there is no fingerprint, it is derived from the labels.
        One request delivers up to 20 firing alerts. Any beyond that are combined into one message with the count.
        `generic` uses the same format as `MessageCreate` and accepts only `notice`, `progress`, and `alert`.
        `datadog` reads `alert_id`, `scope`, `title`, `message`, `transition`, `priority`, and `url` from the webhook payload you
        configure. `transition: Recovered` resolves the alert.
        `sentry` reads issue, event alert, and metric alert webhooks, and the legacy WebHooks plugin.
        `pagerduty` reads V3 webhooks. `incident.triggered` and `incident.reopened` create an alert, and `incident.resolved` resolves it.
        These three return `202` without creating a message for events they do not use.
        The request body is limited to 256 KB.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Accepted
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/meta:
    get:
      tags: [Meta]
      operationId: getMeta
      summary: Get service status
      security: []
      responses:
        "200":
          description: Current operating mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
webhooks:
  actionEvent:
    post:
      summary: Receive responses and state changes
      description: |
        Sent to a URL that is registered on the channel and has passed the ownership check.
        Any non-`2xx` response or a 10-second timeout counts as a failure. Retries are sent after 1 minute, 5 minutes, 30 minutes, and so on, for up to 24 hours.
        Redirects are not followed. The same event can arrive more than once, so deduplicate with `Nodd-Event-Id`.

        At registration, `{"type":"verification","challenge":"..."}` is sent without a signature.
        A URL is registered only if it returns a `2xx` response whose body contains the `challenge` value.
        Only https on port 443 with a named host that resolves to a public address is accepted.

        Expiry is reported after the 10-minute grace period for responses has passed.
        On Team, `delivery.expired` reports a message that no one was confirmed to have received within the delivery window.

        The signature format is `Nodd-Signature: t=<unix seconds>,v1=<hex>`.
        `v1` is the HMAC-SHA256 of `<t>.<raw body>`. Receivers must reject a `t` older than 5 minutes.
      security: []
      parameters:
        - name: Nodd-Signature
          in: header
          required: true
          schema:
            type: string
        - name: Nodd-Event-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionEvent"
      responses:
        "200":
          description: Received
components:
  securitySchemes:
    sendKey:
      type: http
      scheme: bearer
      description: Send key for one channel. Starts with `nodd_live_` or `nodd_test_` and ends with a check value.
    readKey:
      type: http
      scheme: bearer
      description: Key for one channel that reads response events. It cannot send.
    replyToken:
      type: http
      scheme: bearer
      description: Token returned at send time that can read the state of that one message only.
  parameters:
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^msg_[0-9A-Za-z]{26}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Key that prevents duplicate sends on retry. Valid for 24 hours. The same key returns the first result.
      schema:
        type: string
        maxLength: 128
  headers:
    RateLimitRemaining:
      description: Sends remaining in the current time window
      schema:
        type: integer
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "`rate_limited` or `monthly_limit`"
      headers:
        Retry-After:
          description: Seconds until retry
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: "`maintenance` or `overloaded`"
      headers:
        Retry-After:
          description: Seconds until retry
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AlertKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[0-9A-Za-z._:-]+$"
    Field:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
          maxLength: 24
        value:
          type: string
          maxLength: 80
    Link:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          maxLength: 24
        url:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 512
    Option:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          maxLength: 32
        label:
          type: string
          maxLength: 16
        style:
          type: string
          enum: [default, primary, destructive]
          default: default
    Audience:
      type: object
      additionalProperties: false
      description: If omitted, the message goes to everyone in the channel. Only the addressed people see the Action tab count increase.
      properties:
        members:
          type: array
          maxItems: 20
          items:
            type: string
        roles:
          type: array
          items:
            type: string
            enum: [manager, responder]
    Progress:
      type: object
      additionalProperties: false
      required: [current, total]
      properties:
        current:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
        label:
          type: string
          maxLength: 40
        state:
          type: string
          enum: [running, succeeded, failed]
          default: running
    MessageCreate:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [notice, progress, alert, approval, choice]
          description: "`input` will be added in a later version."
        level:
          type: string
          enum: [low, normal, high]
          default: normal
          description: "`critical` is reserved for future use. Levels map to iOS Passive, Active, and Time Sensitive."
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 4000
          description: Up to 1,000 characters, or 4,000 when `format` is `markdown`.
        format:
          type: string
          enum: [plain, markdown]
          default: plain
          description: |
            `markdown` formats headings, lists, quotes, code, bold, italics, and links in the app. HTML, images, and tables are not
            rendered, and only https links open. Notifications show the body without the markup.
        image:
          type: object
          additionalProperties: false
          description: |
            A JPEG or PNG up to 40 KB. It travels inside the sealed message, so the same encryption and deletion apply as the body.
            Not available on `progress`. The request can be up to 64 KB.
          required: [data]
          properties:
            data:
              type: string
              description: Base64.
            alt:
              type: string
              maxLength: 120
              description: Text for screen readers.
        fields:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Field"
        links:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/Link"
        options:
          type: array
          description: "Required for `choice`, with 2 to 4 options. Do not set for `approval`."
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/Option"
        confirm:
          type: boolean
          description: "Requires Face ID to respond. Defaults to `true` for `approval` and `false` for `choice`."
        expires_in:
          type: integer
          minimum: 60
          maximum: 2592000
          description: Seconds until the response deadline. Cannot exceed the plan's delivery window. If omitted for a kind that needs a response, the delivery window is used.
        on_timeout:
          type: string
          enum: [reject, ignore]
          default: reject
          description: What to do on expiry. Services must not treat a missing response as approval.
        approvals_required:
          type: integer
          minimum: 1
          maximum: 3
          description: "Number of people needed to finalize an `approval`. Two or more requires Team. The same person counts once, and one rejection finalizes it."
        input:
          type: object
          additionalProperties: false
          description: |
            Show a text field on an `approval` or `choice` answered by one person. The text comes back in `response.note`.
            Without this field, the only text a responder can send is a reason for rejecting.
          required: [prompt]
          properties:
            prompt:
              type: string
              minLength: 1
              maxLength: 40
              description: Label above the text field.
            required:
              type: boolean
              default: false
              description: Refuse responses without text. iOS app 1.0 cannot show the field, so it cannot answer these messages.
        secret:
          type: object
          additionalProperties: false
          description: |
            Ask for a password or other secret on an `approval`. The app shows a masked field, always requires Face ID, and seals
            the value to `public_key` with HPKE (DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305), using the info string
            `nod-secret-v1` and the message ID as additional data. The sealed value is base64(enc || ciphertext).

            Generate a new key pair for each message and keep the private key out of logs. Read the value with
            `GET /v1/messages/{id}/secret`. It is not in `response`, `/v1/actions/events`, or callbacks.
            The server cannot read the value, but it does relay `public_key`, so this does not protect against a compromised server.

            Cannot be combined with `input`, `dedupe_key`, `confirm: false`, or more than one approver.
            iOS app 1.0 cannot show the field, so it can only reject these messages.
          required: [public_key]
          properties:
            public_key:
              type: string
              description: X25519 public key, Base64.
        escalate_after:
          type: integer
          minimum: 60
          maximum: 2592000
          description: If no one responds for this many seconds, responders who have turned off notifications are also alerted, and `action.escalated` is recorded. Must be shorter than the response deadline. Team only.
        escalate_to:
          $ref: "#/components/schemas/Audience"
        alert_key:
          $ref: "#/components/schemas/AlertKey"
        dedupe_key:
          type: string
          maxLength: 128
          description: Combines unresolved messages with the same key into one and counts them. These do not count toward limits.
        progress:
          $ref: "#/components/schemas/Progress"
        to:
          $ref: "#/components/schemas/Audience"
        sensitive:
          type: boolean
          default: false
          description: Hides the message content on the lock screen.
        delivery:
          type: string
          enum: [immediate, digest]
          default: immediate
          description: "`digest` holds the message for the hourly digest notification. Allowed only for `low`. The content can still be fetched by sync in the meantime."
        metadata:
          type: object
          description: Values returned as is in response events. Up to 1 KB.
          additionalProperties:
            type: string
    MessageUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        progress:
          $ref: "#/components/schemas/Progress"
    MessageAccepted:
      type: object
      required: [id, status, reply_token, sent_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued]
        reply_token:
          type: string
        sent_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        deduped:
          type: boolean
    ActionState:
      type: string
      enum: [open, claimed, delivered, done, expired, failed, cancelled]
    Response:
      type: object
      required: [option_id, actor, assurance, responded_at, signature]
      properties:
        option_id:
          type: string
          description: "For `approval`, this is `approve` or `reject`."
        actor:
          type: object
          required: [id, display_name]
          properties:
            id:
              type: string
            display_name:
              type: string
        assurance:
          type: string
          enum: [none, biometric]
        responded_at:
          type: string
          format: date-time
          description: Time signed by the device.
        note:
          type: string
          maxLength: 200
          description: Text written by the responder, either a reason for rejecting or the answer to `input`. Covered by the signature. It is not sealed, so use `secret` to ask for secrets.
        secret_digest:
          type: string
          description: Lowercase hex SHA-256 of the sealed secret, as Base64 text. Present only on responses to `secret`, and covered by the signature.
        signature:
          type: object
          description: Device signature that can be verified without trusting the server.
          required: [alg, key_id, value, nonce]
          properties:
            alg:
              type: string
              enum: [ES256]
            key_id:
              type: string
            value:
              type: string
            nonce:
              type: string
              description: Value included in the signed data. `responded_at` is returned as the exact string the device signed.
    Delivery:
      type: object
      description: Estimates. `unconfirmed` does not mean the message was not delivered.
      properties:
        confirmed:
          type: integer
        delayed:
          type: integer
        unconfirmed:
          type: integer
        failed:
          type: integer
    MessageState:
      type: object
      required: [id, kind, sent_at, delivery]
      properties:
        id:
          type: string
        kind:
          type: string
        source:
          type: string
          description: Path recorded by the server. Senders cannot set it.
          enum: [api, cli, github_action, mcp, slack, grafana, alertmanager, generic, datadog, sentry, pagerduty]
        sent_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        action_state:
          $ref: "#/components/schemas/ActionState"
        response:
          $ref: "#/components/schemas/Response"
        approvals_required:
          type: integer
          description: Number of approvals needed to finalize.
        approvals:
          type: array
          description: Approvals collected before finalizing.
          items:
            $ref: "#/components/schemas/Response"
        delivery:
          $ref: "#/components/schemas/Delivery"
        resolved_at:
          type: string
          format: date-time
    ActionResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [succeeded, failed]
        summary:
          type: string
          maxLength: 200
    ActionEvent:
      type: object
      required: [id, type, occurred_at, message_id]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [action.responded, action.escalated, action.expired, action.cancelled, delivery.expired]
        occurred_at:
          type: string
          format: date-time
        message_id:
          type: string
        response:
          $ref: "#/components/schemas/Response"
        metadata:
          type: object
          additionalProperties:
            type: string
        on_timeout:
          type: string
          enum: [reject, ignore]
          description: "Present only on `action.expired`. The handling set at send time."
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - invalid_key
            - key_revoked
            - forbidden
            - validation_failed
            - payload_too_large
            - unsupported_level
            - rate_limited
            - monthly_limit
            - channel_paused
            - open_actions_exceeded
            - already_claimed
            - action_expired
            - invalid_state
            - not_found
            - plan_required
            - channel_read_only
            - maintenance
            - overloaded
            - internal
        detail:
          type: string
        request_id:
          type: string
    Meta:
      type: object
      required: [mode, api_version]
      properties:
        mode:
          type: string
          enum: [normal, degraded, read_only, intake_stopped]
        api_version:
          type: string
        notice:
          type: string
